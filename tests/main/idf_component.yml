## Dependencies for the test application.
## Kept in step with ../../main/idf_component.yml for the modules under test —
## device_registry.h includes cJSON.h, which moved out of ESP-IDF core in v6.
dependencies:
  idf:
    version: ">=5.0,<7.0"

  espressif/cjson:
    version: "^1.0"

  ## zb_diagnostics.c includes zb_device_handler_types.h, which pulls in
  ## esp_zigbee_core.h for its types, and calls esp_zb_zcl_read_attr_cmd_req().
  ## Same versions as the gateway so the tests build against the same SDK.
  espressif/esp-zigbee-lib:
    version: "^1.6.8"

  espressif/esp-zboss-lib:
    version: "^1.6.4"
